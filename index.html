<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1877F2"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hamdam"></head><body>
<title>Hamdam</title><script>window.HAMDAM_CONFIG={mode:"remote",baseUrl:"https://hamdam-server.onrender.com"}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width app column (centered card on desktop). Top bar, scrolling view, bottom tabs. Sheets, chat and onboarding slide over the column. Identity: Facebook-blue system, clean white cards, heart logo kept, faceless illustrated portraits, no real photos. */
:root {
  --bg: #F0F2F5; --surface: #FFFFFF; --ink: #050505; --muted: #65676B; --line: #E4E6EB;
  --brand: #1877F2; --brand-hover: #166FE5; --on-brand: #FFFFFF; --accent: #0084FF; --gold: #A97F2E; --ok: #31A24C; --warn: #B7791F; --danger: #E41E3F;
  --chip: #F0F2F5; --shadow: 0 2px 12px rgba(0, 0, 0, .12); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .12);
  --f-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans Arabic', sans-serif;
  --f-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans Arabic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18191A; --surface: #242526; --ink: #E4E6EB; --muted: #B0B3B8; --line: #3E4042;
    --brand: #2D88FF; --brand-hover: #4294FF; --on-brand: #FFFFFF; --accent: #0099FF; --gold: #E0BE74; --ok: #31A24C; --warn: #F5C33B; --danger: #F02849;
    --chip: #3A3B3C; --shadow: 0 2px 12px rgba(0, 0, 0, .45); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18191A; --surface: #242526; --ink: #E4E6EB; --muted: #B0B3B8; --line: #3E4042;
  --brand: #2D88FF; --brand-hover: #4294FF; --on-brand: #FFFFFF; --accent: #0099FF; --gold: #E0BE74; --ok: #31A24C; --warn: #F5C33B; --danger: #F02849;
  --chip: #3A3B3C; --shadow: 0 2px 12px rgba(0, 0, 0, .45); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}
html, body { height: 100%; }
body {
  box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .pcard:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 700px) {
  body { padding-block: 16px; }
  #app { border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); background: var(--bg); padding-inline: 16px; }
  .layer, .onb { padding-inline: 16px; }
}
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-inline: -16px; padding: 10px 16px 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--brand); }
.logo svg { width: 30px; height: 30px; }
.logo img { width: 30px; height: 30px; object-fit: contain; }
.welcome img.big { object-fit: contain; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--chip); display: grid; place-items: center; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 16px; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--brand) 45%, transparent) transparent; }
.scroll::-webkit-scrollbar { width: 5px; }
.scroll::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--brand) 45%, transparent); border-radius: 99px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.sheet-panel, .msgs, .onb .body { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--brand) 45%, transparent) transparent; }
.sheet-panel::-webkit-scrollbar, .msgs::-webkit-scrollbar, .onb .body::-webkit-scrollbar { width: 5px; }
.sheet-panel::-webkit-scrollbar-thumb, .msgs::-webkit-scrollbar-thumb, .onb .body::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--brand) 45%, transparent); border-radius: 99px; }
.sheet-panel::-webkit-scrollbar-track, .msgs::-webkit-scrollbar-track, .onb .body::-webkit-scrollbar-track { background: transparent; }
.hrow, .ice, .gal { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--brand) 45%, transparent) transparent; }
.hrow::-webkit-scrollbar, .ice::-webkit-scrollbar, .gal::-webkit-scrollbar { height: 5px; }
.hrow::-webkit-scrollbar-thumb, .ice::-webkit-scrollbar-thumb, .gal::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--brand) 45%, transparent); border-radius: 99px; }
.hrow::-webkit-scrollbar-track, .ice::-webkit-scrollbar-track, .gal::-webkit-scrollbar-track { background: transparent; }
h2.t { font-family: var(--f-display); font-weight: 800; font-size: 20px; margin: 6px 0 10px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--chip); border-radius: 8px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 8px 6px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand); box-shadow: var(--shadow-sm); }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); gap: 4px; margin: 4px -16px 0; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; padding: 6px 2px; border-radius: 8px; }
.tab[aria-current="page"] { color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, var(--surface)); }
.dot { position: absolute; top: 4px; inset-inline-end: calc(50% - 20px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--danger); color: var(--on-brand); font-size: 11px; line-height: 17px; text-align: center; }

/* portraits */
.art { position: absolute; inset: 0; }
.art svg { width: 100%; height: 100%; display: block; }
.art.blur svg, .art.blur img { filter: blur(16px); transform: scale(1.12); }
.art img { width: 100%; height: 100%; display: block; object-fit: cover; }
.lockmark { position: absolute; top: 50%; inset-inline: 0; text-align: center; transform: translateY(-50%); color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 6px rgba(0,0,0,.5); display: grid; justify-items: center; gap: 6px; }
.lockmark svg { width: 34px; height: 34px; }
.ph .lockmark span { display: none; }
.ph .lockmark svg { width: 20px; height: 20px; }

/* discover */
.filters-row { display: flex; gap: 8px; align-items: center; }
.filters-row .seg { flex: 1; }
#deckwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .stack { position: relative; flex: 1; min-height: 0; margin-block: 10px; }
.pcard { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; background: var(--chip); box-shadow: var(--shadow); touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; transition: transform .28s ease, opacity .28s ease; }
.pcard.back { transform: scale(.94) translateY(12px); pointer-events: none; opacity: .85; }
.pinfo { position: absolute; inset-inline: 0; bottom: 0; padding: 80px 20px 20px; background: linear-gradient(transparent, rgba(0, 0, 0, .45) 38%, rgba(0, 0, 0, .8)); color: #fff; }
.pname { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.4; }
.pmeta { font-size: 14px; opacity: .92; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--chip); color: var(--ink); }
.pcard .chip { background: rgba(255,255,255,.2); color: #fff; backdrop-filter: blur(6px); }
.chip.hi { background: color-mix(in srgb, var(--brand) 18%, var(--surface)); color: var(--brand); }
.compat { position: absolute; top: 14px; inset-inline-start: 14px; background: rgba(255,255,255,.86); color: #050505; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; backdrop-filter: blur(6px); box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.online { position: absolute; top: 20px; inset-inline-end: 18px; width: 11px; height: 11px; border-radius: 50%; background: #31A24C; box-shadow: 0 0 0 3px rgba(0,0,0,.25); }
.stamp { position: absolute; top: 60px; padding: 4px 14px; border: 3px solid; border-radius: 10px; font-family: var(--f-display); font-weight: 800; font-size: 22px; opacity: 0; transform: rotate(-10deg); background: rgba(0,0,0,.25); }
.stamp.yes { inset-inline-start: 18px; color: #31A24C; border-color: #31A24C; }
.stamp.no { inset-inline-end: 18px; color: #F02849; border-color: #F02849; }
.vbadge { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-grid; place-items: center; flex: none; }
.vbadge svg { width: 13px; height: 13px; stroke-width: 3; }
.actions { display: flex; justify-content: center; align-items: center; gap: 14px; padding-bottom: 8px; }
.act { width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow-sm); }
.act.sm { width: 46px; height: 46px; }
.act.like { background: var(--brand); color: var(--on-brand); border-color: transparent; width: 68px; height: 68px; box-shadow: 0 10px 24px color-mix(in srgb, var(--brand) 38%, transparent); }
.act.pass { color: var(--muted); }
.act.sup { color: var(--gold); }
.act.rew { color: var(--gold); }
.empty { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; color: var(--muted); padding: 24px; }
.empty b { font-family: var(--f-display); font-size: 19px; color: var(--ink); }

/* loading / empty / error states — one look everywhere */
.spin { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.errbox { display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; color: var(--muted); padding: 32px 24px; min-height: 60vh; }
.errbox b { color: var(--ink); font-size: 17px; }
.errbox .btn { margin-top: 6px; min-width: 200px; }
.skel { border-radius: 8px; background: linear-gradient(90deg, var(--chip) 25%, var(--line) 50%, var(--chip) 75%); background-size: 200% 100%; animation: shimmer 1.2s ease infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.skel-card { height: 420px; border-radius: 16px; }
.empty-ic { width: 72px; height: 72px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 30px; }
@media (prefers-reduced-motion: reduce) { .spin, .skel { animation: none; } }

/* buttons */
.btn { border: 0; border-radius: 8px; padding: 13px 18px; font-weight: 800; font-size: 16px; background: var(--brand); color: var(--on-brand); box-shadow: 0 6px 16px color-mix(in srgb, var(--brand) 26%, transparent); }
.btn.alt, .btn.ghost, .btn[disabled] { box-shadow: none; }
.btn.alt { background: var(--chip); color: var(--ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; }
.btn:not(.alt):not(.ghost):hover { background: var(--brand-hover); }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; }

/* likes */
.hrow { display: flex; gap: 12px; overflow-x: auto; padding-block: 4px 10px; scrollbar-width: none; }
.hrow::-webkit-scrollbar { display: none; }
.mini { flex: none; width: 74px; text-align: center; background: transparent; border: 0; font-size: 12.5px; font-weight: 700; }
.mini .ph { position: relative; width: 68px; height: 68px; border-radius: 50%; overflow: hidden; margin: 0 auto 4px; border: 3px solid var(--brand); } .phview { position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; } .phview img { max-width: 100%; max-height: 72vh; object-fit: contain; border-radius: 12px; } .phview-bar { display: flex; gap: 8px; align-items: center; color: #fff; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gcard { position: relative; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; border: 0; padding: 0; background: var(--chip); text-align: start; }
.gcard .pinfo { padding: 40px 12px 12px; }
.gcard .pname { font-size: 16px; }
.xcard { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: start; cursor: pointer; }
.xcard .xph { position: relative; width: 84px; height: 84px; border-radius: 8px; overflow: hidden; flex: none; }
.xcard .xinfo { flex: 1; min-width: 0; }
.xcard .pmeta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.xcomp { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--brand); color: #fff; font-size: 20px; flex: none; cursor: pointer; }

/* chat list */
.crow { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; width: 100%; text-align: start; }
.crow .ph { position: relative; width: 54px; height: 54px; border-radius: 50%; overflow: hidden; flex: none; }
.crow .tx { flex: 1; min-width: 0; }
.crow .nm { font-weight: 800; display: flex; gap: 6px; align-items: center; }
.crow .pv { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unread { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); flex: none; }
.left { font-size: 12px; color: var(--warn); font-weight: 700; }

/* overlays */
.layer { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 30; animation: slideIn .25s ease; }
@keyframes slideIn { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet { position: absolute; inset: 0; z-index: 55; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); animation: fade .2s ease; }
.sheet-panel { position: absolute; inset-inline: 0; bottom: 0; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 12px 12px 0 0; padding: 8px 16px 20px; box-shadow: 0 -4px 24px rgba(0,0,0,.18); animation: up .28s cubic-bezier(.2,.8,.2,1); }
.sheet-panel.full { height: 92%; padding: 0 0 20px; }
.grip { width: 42px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 12px; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet-panel h3 { font-family: var(--f-display); font-size: 18px; margin: 4px 0 10px; }

/* profile detail */
.hero { position: relative; height: 340px; border-radius: 12px 12px 0 0; overflow: hidden; }
.pbody { padding: 14px 16px 0; display: grid; gap: 14px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 15px; box-shadow: var(--shadow-sm); }
.box h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
.box p { margin: 0; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.kv div span { display: block; font-size: 12px; color: var(--muted); }
.kv div b { font-size: 14.5px; }
.why { display: grid; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
.why li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.why svg { color: var(--ok); width: 18px; height: 18px; margin-top: 4px; }
.meter { height: 9px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--brand)); border-radius: 99px; }
.backbtn { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 3; background: rgba(0,0,0,.55); color: #fff; border: 0; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.sticky-act { display: flex; gap: 10px; padding: 12px 16px 0; }

/* chat */
.chead { display: flex; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.chead .ph { position: relative; width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex: none; }
.chead .nm { flex: 1; min-width: 0; font-weight: 800; line-height: 1.3; }
.chead .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-block: 12px; }
.bub { max-width: 80%; padding: 9px 13px; border-radius: 18px; word-wrap: break-word; overflow-wrap: anywhere; }
.bub.me { align-self: flex-start; background: color-mix(in srgb, var(--brand) 88%, #fff); color: var(--on-brand); border-end-start-radius: 5px; }
.bub.them { align-self: flex-end; background: var(--chip); border: 0; border-end-end-radius: 5px; }
.bub small { display: block; font-size: 11px; opacity: .7; margin-top: 2px; }
.sysmsg { align-self: center; text-align: center; font-size: 12.5px; color: var(--muted); background: var(--chip); border-radius: 8px; padding: 6px 12px; max-width: 92%; }
.voice { display: flex; align-items: center; gap: 8px; }
.wave { display: flex; align-items: center; gap: 2px; height: 22px; }
.wave i { width: 3px; border-radius: 2px; background: currentColor; opacity: .75; }
.banner { display: flex; gap: 8px; align-items: flex-start; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-top: 8px; }
.banner.warn { background: color-mix(in srgb, var(--warn) 13%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.banner button { border: 0; background: transparent; font-weight: 800; color: var(--brand); padding: 0 6px; }
.ice { display: flex; gap: 8px; overflow-x: auto; padding-block: 6px; scrollbar-width: none; }
.ice::-webkit-scrollbar { display: none; }
.ice button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; }
.compose { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.compose input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 11px 16px; font: inherit; }
.typing { align-self: flex-end; color: var(--muted); font-size: 13px; padding: 2px 8px; }

/* forms */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .lbl { font-weight: 700; font-size: 14px; }
.field input, .field select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 11px 14px; font: inherit; min-width: 0; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice.three { grid-template-columns: 1fr; }
.pick { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; text-align: start; font-weight: 700; }
.pick small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.pick[aria-pressed="true"] { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 9%, var(--surface)); }
.tagrow { display: flex; flex-wrap: wrap; gap: 8px; }
.tagrow button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; }
.tagrow button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.setrow .tx { flex: 1; min-width: 0; }
.setrow .tx b { display: block; }
.setrow .tx small { color: var(--muted); font-size: 12.5px; line-height: 1.5; display: block; }
.sw { position: relative; width: 48px; height: 28px; border-radius: 99px; border: 0; background: var(--line); flex: none; }
